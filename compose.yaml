services:
  dance-library:
    build: .
    ports:
      - "127.0.0.1:${DANCE_PORT:-8792}:8791"
    volumes:
      - ./var/docker:/app/data
    environment:
      MUSIC_RECOGNITION_PROVIDER: disabled
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8791/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
