</head><body><div class="vocal-practice is-immersive"><header class="vocal-immersive__bar"><button type="button" class="vocal-immersive__back" aria-label="退出沉浸"><span aria-hidden="true">‹</span></button><div class="vocal-immersive__heading"><h2 class="vocal-immersive__title" title="여름 안에서 (Live)">여름 안에서 (Live)</h2><p class="vocal-immersive__sub" title="宋雨琦 · 泳勋 · Felix">宋雨琦 · 泳勋 · Felix</p></div><button type="button" class="vocal-immersive__segments" aria-pressed="true" aria-label="分段"><span aria-hidden="true">▤</span> 分段</button><button type="button" class="vocal-immersive__more" aria-label="更多">…</button></header><div class="vocal-segments" role="group" aria-label="段落标签"><button type="button" class="vocal-segments__chip is-playing" aria-pressed="true" aria-label="跳到 A1 主歌"><span class="vocal-segments__code">A1</span><span class="vocal-segments__type">主歌</span></button><button type="button" class="vocal-segments__chip" aria-pressed="false" aria-label="跳到 B1 副歌"><span class="vocal-segments__code">B1</span><span class="vocal-segments__type">副歌</span></button><button type="button" class="vocal-segments__chip" aria-pressed="false" aria-label="跳到 R1 Rap"><span class="vocal-segments__code">R1</span><span class="vocal-segments__type">Rap</span></button></div><section class="vocal-block vocal-lyrics-block" aria-label="歌词"><div class="vocal-lyrics vocal-lyrics--normal"><section class="vocal-lyric-group" aria-label="A1 主歌"><p class="vocal-lyric-group__title"><span>A1 · 主歌</span><span class="vocal-lyric-group__rule" aria-hidden="true"></span></p><ol class="vocal-lyric-group__list"><li class="vocal-lyric-item"><button type="button" class="vocal-line vocal-line--active" aria-current="true" aria-label="第 1 句：바람이 내게 말을 걸어"><span class="vocal-line__body"><span class="vocal-line__text">바람이 내게 말을 걸어</span></span></button></li><li class="vocal-lyric-item"><button type="button" class="vocal-line" aria-label="第 2 句：작은 햇살이 창에 내려"><span class="vocal-line__body"><span class="vocal-line__text">작은 햇살이 창에 내려</span></span></button></li><li class="vocal-lyric-item"><button type="button" class="vocal-line" aria-label="第 3 句：오늘의 길을 천천히 걸어"><span class="vocal-line__body"><span class="vocal-line__text">오늘의 길을 천천히 걸어</span></span></button></li><li class="vocal-lyric-item"><button type="button" class="vocal-line" aria-label="第 4 句：어디선가 노래가 들려"><span class="vocal-line__body"><span class="vocal-line__text">어디선가 노래가 들려</span></span></button></li></ol></section><section class="vocal-lyric-group" aria-label="B1 副歌"><p class="vocal-lyric-group__title"><span>B1 · 副歌</span><span class="vocal-lyric-group__rule" aria-hidden="true"></span></p><ol class="vocal-lyric-group__list"><li class="vocal-lyric-item"><button type="button" class="vocal-line" aria-label="第 5 句：우리 함께라면 더 좋아"><span class="vocal-line__body"><span class="vocal-line__text">우리 함께라면 더 좋아</span></span></button></li><li class="vocal-lyric-item"><button type="button" class="vocal-line" aria-label="第 6 句：서로의 웃음을 기억해"><span class="vocal-line__body"><span class="vocal-line__text">서로의 웃음을 기억해</span></span></button></li><li class="vocal-lyric-item"><button type="button" class="vocal-line" aria-label="第 7 句：머리 끄덩이에 맴돌아"><span class="vocal-line__body"><span class="vocal-line__text">머리 끄덩이에 맴돌아</span></span></button></li><li class="vocal-lyric-item"><button type="button" class="vocal-line" aria-label="第 8 句：이 밤이 지나면"><span class="vocal-line__body"><span class="vocal-line__text">이 밤이 지나면</span></span></button></li></ol></section><section class="vocal-lyric-group" aria-label="R1 Rap"><p class="vocal-lyric-group__title"><span>R1 · Rap</span><span class="vocal-lyric-group__rule" aria-hidden="true"></span></p><ol class="vocal-lyric-group__list"><li class="vocal-lyric-item"><button type="button" class="vocal-line" aria-label="第 9 句：밤하늘 아래 우리"><span class="vocal-line__body"><span class="vocal-line__text">밤하늘 아래 우리</span></span></button></li><li class="vocal-lyric-item"><button type="button" class="vocal-line" aria-label="第 10 句：같이 걸어가자"><span class="vocal-line__body"><span class="vocal-line__text">같이 걸어가자</span></span></button></li><li class="vocal-lyric-item"><button type="button" class="vocal-line" aria-label="第 11 句：너와 나의 계절"><span class="vocal-line__body"><span class="vocal-line__text">너와 나의 계절</span></span></button></li></ol></section><section class="vocal-lyric-group"><ol class="vocal-lyric-group__list"><li class="vocal-lyric-item"><button type="button" class="vocal-line" aria-label="第 12 句：여름 안에서"><span class="vocal-line__body"><span class="vocal-line__text">여름 안에서</span></span></button></li></ol></section></div></section><div class="vocal-dock vocal-dock--immersive" role="group" aria-label="练唱播放器"><audio class="vocal-audio" preload="metadata" src="http://localhost:3000/api/media/audio/orig"></audio><div class="vocal-immersive__timeline"><span class="vocal-immersive__clock">0:00</span><input class="vocal-dock__progress" aria-label="播放进度" min="0" max="201000" step="100" type="range" value="0"><span class="vocal-immersive__clock">3:21</span></div><div class="vocal-immersive__transport" role="group" aria-label="播放控制"><button type="button" aria-label="后退 5 秒">−5s</button><button type="button" aria-label="上一句"><span aria-hidden="true">⏮</span> 上句</button><button type="button" class="vocal-dock__play" aria-label="播放"><span class="vocal-dock__play-icon" aria-hidden="true">▶</span></button><button type="button" aria-label="下一句">下句 <span aria-hidden="true">⏭</span></button><button type="button" aria-label="前进 10 秒">+10s</button></div><div class="vocal-immersive__practice" role="group" aria-label="逐句练习"><button type="button" aria-pressed="false" disabled="" aria-label="跳过 Rap">跳Rap</button><button type="button" aria-pressed="false" aria-label="循环 2 句">2句</button><button type="button" aria-pressed="false" aria-label="循环 4 句">4句</button><button type="button" aria-pressed="false" aria-expanded="false" aria-label="自定义循环句数，当前 4 句">自定义</button><button type="button" aria-pressed="false" aria-lab
