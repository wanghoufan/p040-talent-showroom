<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><title>P040 V3.2 · 歌曲地图手机端预览</title><style>
:root{color-scheme:light;--bg:#fbfcfd;--card:#fff;--fg:#172234;--muted:#697588;--border:#e2e8f0;--primary:#225cdd;--soft:#eff5ff;--hi:#dce9ff;--danger:#b45309}
:root[data-theme=dark]{color-scheme:dark;--bg:#0c1320;--card:#172437;--fg:#f2f6ff;--muted:#bac5d3;--border:#354357;--primary:#8fb4ff;--soft:#1e304a;--hi:#284c79;--danger:#ffd284}
*{box-sizing:border-box}html,body{margin:0;font-family:system-ui,-apple-system,'PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--fg)}button,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--border);border-radius:12px;background:var(--card);min-height:42px;padding:8px 11px}button:focus-visible,select:focus-visible{outline:3px solid var(--primary);outline-offset:2px}.app{max-width:420px;min-height:100dvh;margin:auto;padding:12px 14px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.top strong{font-size:16px}.small{font-size:12px;color:var(--muted)}h1{font-size:22px;margin:18px 0 4px}h2{font-size:18px;margin:0 0 9px}.card{border:1px solid var(--border);border-radius:15px;background:var(--card);padding:13px;margin-top:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{font-size:12px;padding:4px 8px;border-radius:20px;background:var(--soft);color:var(--primary)}.map{display:flex;gap:4px;height:12px;border-radius:6px;overflow:hidden;margin:9px 0 13px;background:var(--soft)}.map button{padding:0;min-width:3px;min-height:0;border:0;border-radius:0;outline-offset:1px;opacity:.75}.map button[aria-pressed=true]{opacity:1;box-shadow:inset 0 0 0 2px var(--fg)}.segments{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.seg{min-width:0;padding:7px 3px;border-radius:10px;display:flex;flex-direction:column;gap:2px;min-height:56px}.seg[aria-pressed=true]{border-color:var(--primary);background:var(--hi)}.seg b{font-size:16px}.seg small{font-size:11px;color:var(--muted)}.a{background:#77a4f8}.b{background:#ed8cb5}.c{background:#70c7ae}.p{background:#a59cf4}.r{background:#f4bf67}.i,.u{background:#9ba7b7}.detailTitle{font-weight:800;font-size:25px}.desc{color:var(--muted);line-height:1.5;font-size:13px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:10px 0}.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.lyric{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);border-radius:0;min-height:40px;padding:9px 2px}.lyric time{font-size:12px;color:var(--muted);flex:0 0 37px}.lyric span{flex:1}.lyric.chosen{background:var(--hi)}.editor{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.editor select{border:1px solid var(--border);background:var(--card);border-radius:10px;min-height:42px;padding:4px;flex:1;min-width:80px}.status{font-size:12px;color:var(--muted);min-height:28px;line-height:1.5}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;border-top:1px solid var(--border);background:var(--card);padding:9px 2px max(10px,env(safe-area-inset-bottom))}.navInner{max-width:420px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:0}.nav span{font-size:11px;text-align:center;color:var(--muted)}.nav span:first-child{color:var(--primary);font-weight:700}.warning{font-size:12px;color:var(--danger)}@media(min-width:520px){.app{box-shadow:0 0 22px #0002;border-inline:1px solid var(--border)}}
</style></head><body><div class="app">
<div class="top"><strong>‹　唱歌 · 歌曲详情</strong><button id="theme" aria-label="切换浅色深色">☾ 深色</button></div>
<h1>示例歌曲</h1><div class="small">演示素材（非真实用户歌曲）　·　练习中　·　3:00</div>
<div class="card"><div class="row"><h2>歌曲地图</h2><span class="tag">音频分析草稿 · 待核实</span></div><div class="small">A=主歌、B=副歌、P=预副歌、C=桥段。同类型不等于同旋律。</div><div id="timeline" class="map" aria-label="歌曲时间轴"></div><div id="segments" class="segments"></div></div>
<div class="card"><div class="row"><div><span id="code" class="detailTitle">A1</span>　<strong id="typeName">主歌</strong></div><span id="time" class="small">0:15</span></div><p id="relation" class="desc">重复关系待听辨，不因歌词重复而自动认定。</p><div class="actions"><button id="seek" class="primary">▶ 跳到本段起点</button><button id="loop">↻ 设为段落循环</button></div><div class="row"><h2>本段歌词</h2><span id="count" class="small"></span></div><div id="lyrics"></div><div class="editor"><select id="changeType" aria-label="调整该段类型"><option value="verse">主歌</option><option value="chorus">副歌</option><option value="pre">预副歌</option><option value="bridge">桥段</option><option value="rap">Rap（仅人工确认）</option><option value="intro">前奏</option><option value="outro">尾奏</option><option value="unknown">待标注</option></select><button id="split">在选中歌词处分段</button><button id="merge">合并下一段</button></div><div class="status" id="status">当前只演示段落交互，不播放音乐、不修改 P040 数据。</div></div>
<div class="card"><div class="row"><h2>练习设置</h2><span class="small">保持原有播放器</span></div><div class="small">逐句循环、原唱/已有伴奏切换、合练等能力保留。本轮没有任何伴奏提取任务。</div><div class="editor"><button id="reset">重置示例地图</button><button id="export">预览保存数据</button></div><pre id="exportOut" style="white-space:pre-wrap;word-break:break-word;font-size:11px;max-height:110px;overflow:auto"></pre></div>
<p class="warning">注意：此页面用于确定交互方案。真实歌曲结构必须由音频分析产生，模型输出未经听辨不得视为准确结构。</p>
</div><div class="nav"><div class="navInner"><span>▣<br>曲库</span><span>☷<br>今晚节目单</span><span>♫<br>演出模式</span><span>◉<br>我的</span></div></div>
<script>
const initial=[{s:0,e:15,t:'intro'},{s:15,e:38,t:'verse'},{s:38,e:53,t:'pre'},{s:53,e:78,t:'chorus'},{s:78,e:102,t:'verse'},{s:102,e:126,t:'chorus'},{s:126,e:148,t:'bridge'},{s:148,e:173,t:'chorus'},{s:173,e:180,t:'outro'}];
const lyricData=[{s:15,t:'城市在雨里醒来'},{s:25,t:'灯光照着回家的路'},{s:38,t:'我听见风轻轻呼唤'},{s:53,t:'把今天唱给明天听'},{s:64,t:'把故事留给夜晚听'},{s:78,t:'街口的店又亮起来'},{s:90,t:'脚步慢慢找到了方向'},{s:102,t:'把今天唱给明天听'},{s:113,t:'把故事留给夜晚听'},{s:126,t:'新的节奏在这里转弯'},{s:148,t:'把今天唱给明天听'},{s:160,t:'把故事留给夜晚听'}];
const typeName={intro:'前奏',outro:'尾奏',verse:'主歌',pre:'预副歌',chorus:'副歌',bridge:'桥段',rap:'Rap',unknown:'待标注'};const family={verse:'A',pre:'P',chorus:'B',bridge:'C',rap:'R',unknown:'U'};const fmt=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;
let data=initial.map((x,i)=>({...x,id:`s-${i}`})),active='s-1',selectedLyric=null,loop=null,theme='light';try{theme=localStorage.getItem('p040-song-map-preview-theme')||'light'}catch{};
function codes(){const counts={};return data.map(x=>({...x,code:family[x.t]?`${family[x.t]}${counts[x.t]=(counts[x.t]||0)+1}`:typeName[x.t]}))}
function status(msg){document.getElementById('status').textContent=msg}
function draw(){const arr=codes(),current=arr.find(x=>x.id===active)||arr[0];active=current.id;
 const timeline=document.getElementById('timeline'),segments=document.getElementById('segments');timeline.innerHTML='';segments.innerHTML='';
 for(const x of arr){const b=document.createElement('button');b.style.flex=(x.e-x.s);b.className=({verse:'a',chorus:'b',pre:'p',bridge:'c',rap:'r'}[x.t]||'i');b.setAttribute('aria-label',`${x.code} ${fmt(x.s)}`);b.setAttribute('aria-pressed',String(x.id===active));b.onclick=()=>{active=x.id;selectedLyric=null;draw()};timeline.append(b);
 const chip=document.createElement('button');chip.className='seg';chip.setAttribute('aria-pressed',String(x.id===active));chip.innerHTML=`<b>${x.code}</b><small>${fmt(x.s)}</small>`;chip.onclick=()=>{active=x.id;selectedLyric=null;draw()};segments.append(chip)}
 document.getElementById('code').textContent=current.code;document.getElementById('typeName').textContent=typeName[current.t];document.getElementById('time').textContent=`${fmt(current.s)} – ${fmt(current.e)}`;document.getElementById('changeType').value=current.t;
 document.getElementById('relation').textContent=current.t==='rap'?'Rap 由人工选定；跳过 Rap 仍需单独确认。': 'A2/B2 等仅表示第几次出现；旋律是否相同，需要音频证据和听辨确认。';
 const lines=lyricData.filter(l=>l.s>=current.s&&l.s<current.e),list=document.getElementById('lyrics');list.innerHTML='';document.getElementById('count').textContent=`${lines.length} 句`;
 for(const l of lines){const b=document.createElement('button');b.className='lyric'+(selectedLyric===l.s?' chosen':'');const tm=document.createElement('time');tm.textContent=fmt(l.s);b.append(tm,document.createTextNode(l.t));b.onclick=()=>{selectedLyric=l.s;draw();status(`已选 ${fmt(l.s)}，可从这一句拆分段落（预览不播放音频）。`)};list.append(b)}
 if(!lines.length)list.textContent='本段没有需要唱的歌词。';
 document.getElementById('loop').textContent=loop===active?'✓ 已设本段循环':'↻ 设为段落循环';
}
document.getElementById('seek').onclick=()=>{const x=data.find(v=>v.id===active);status(`播放定位请求：${fmt(x.s)}。接入 P040 后调用现有播放器 seekTo，不启动实际音频。`)};
document.getElementById('loop').onclick=()=>{loop=loop===active?null:active;const x=data.find(v=>v.id===active);draw();status(loop?`段落循环区间：${fmt(x.s)}–${fmt(x.e)}（当前仅配置预览）。`:'已退出段落循环')};
document.getElementById('changeType').onchange=e=>{const x=data.find(v=>v.id===active);x.t=e.target.value;draw();status('类型已在预览中更改；仅点击“确认保存”后才应写入正式曲库。')};
document.getElementById('split').onclick=()=>{const i=data.findIndex(v=>v.id===active),s=data[i];if(selectedLyric==null||selectedLyric<=s.s||selectedLyric>=s.e){status('请先点选本段中间的一句歌词，再点拆分。');return}data.splice(i,1,{...s,e:selectedLyric},{...s,id:`s-new-${Date.now()}`,s:selectedLyric});active=data[i+1].id;selectedLyric=null;draw();status('已按歌词时间点拆分，无需手输秒数。')};
document.getElementById('merge').onclick=()=>{const i=data.findIndex(v=>v.id===active);if(i>=data.length-1){status('没有下一段。');return}if(data[i].t!==data[i+1].t){status('两段类型不同：请先调整为同一类型，避免误合并。');return}data[i].e=data[i+1].e;data.splice(i+1,1);draw();status('已合并相邻同类段落。')};
document.getElementById('reset').onclick=()=>{data=initial.map((x,i)=>({...x,id:`s-${i}`}));active='s-1';selectedLyric=null;loop=null;draw();status('已还原示例结构。')};
document.getElementById('export').onclick=()=>{const current=codes();document.getElementById('exportOut').textContent=JSON.stringify(current.map(s=>({id:s.id,type:s.t,label:s.code,startMs:s.s*1000,endMs:s.e*1000,source:'manual'})),null,2).slice(0,1600);status('仅预览 P040 保存字段，未连接任何服务器。')};
function applyTheme(){document.documentElement.dataset.theme=theme;document.getElementById('theme').textContent=theme==='dark'?'☀ 浅色':'☾ 深色';try{localStorage.setItem('p040-song-map-preview-theme',theme)}catch{}};
document.getElementById('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme()};applyTheme();draw();
</script></body></html>
